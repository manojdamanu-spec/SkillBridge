{% extends "base.html" %}
{% block title %}Login | SkillBridge{% endblock %}
{% block content %}
<section class="form-section">
    <form class="form-card" method="POST">
        <span class="eyebrow">Welcome back</span>
        <h1>Log in to SkillBridge</h1>
        <p class="muted">Continue discovering your next opportunity.</p>
        <label>Email address<input type="email" name="email" placeholder="you@example.com" required></label>
        <label>Password<input type="password" name="password" placeholder="Your password" required></label>
        <button class="button primary full-button" type="submit">Log In</button>
        <p class="form-bottom">New to SkillBridge? <a href="{{ url_for('register') }}">Create an account</a></p>
    </form>
</section>
{% endblock %}
